<!-- 载入遮罩 -->
<div class="boot" id="boot" aria-hidden="true">
  <div class="boot__inner">
    <div class="boot__mark">可视化导论</div>
    <div class="boot__sub">VISUALIZATION · INTRODUCTION</div>
    <div class="boot__bar"><i id="bootBar"></i></div>
    <div class="boot__meta"><span id="bootLabel">正在装配课程</span><span id="bootPct">000</span></div>

</div>

<!-- 顶栏 -->

    <a class="brand" href="#/" aria-label="返回课程首页">

      <span class="brand__text">
        <b class="brand__name">可视化导论</b>

      </span>
    </a>
    <nav class="crumbs" id="crumbs" aria-label="面包屑"></nav>
  </div>

  <div class="topbar__right">
    <button class="searchbtn" id="btnSearch" aria-label="搜索课程">
      <span class="searchbtn__icon" aria-hidden="true">⌕</span>
      <span class="searchbtn__text" data-i18n="nav.searchPlaceholder">搜索章节、概念、代码…</span>
      <kbd class="searchbtn__kbd">⌘K</kbd>
    </button>
    <nav class="topnav" aria-label="主导航">
      <a class="topnav__link" href="#/map" data-i18n="nav.map">知识地图</a>
      <a class="topnav__link" href="#/lab" data-i18n="nav.lab">实验室</a>
      <a class="topnav__link" href="#/about" data-i18n="nav.about">重构说明</a>
    </nav>
    <div class="seg" id="themeSeg" role="group" aria-label="主题">
      <button class="seg__btn is-on" data-theme-val="paper" data-i18n="common.paper">纸面</button>
      <button class="seg__btn" data-theme-val="ink" data-i18n="common.ink">墨夜</button>
    </div>
    <div class="seg" id="langSeg" role="group" aria-label="语言">
      <button class="seg__btn is-on" data-lang-val="zh">中</button>
      <button class="seg__btn" data-lang-val="en">EN</button>
    </div>
  </div>
  <div class="topbar__progress" id="topProgress" aria-hidden="true"><i></i></div>

<div class="shell" id="shell">
  <!-- 侧栏：课程目录（阅读页显示） -->
  <aside class="sidenav" id="sidenav" aria-label="课程目录">
    <div class="sidenav__head">
      <div>
        <div class="sidenav__eyebrow" data-i18n="nav.course">课程目录</div>
        <div class="sidenav__progress"><b id="sideDone">0</b><span>/</span><span id="sideTotal">27</span> <em data-i18n="common.sections">节</em></div>
      </div>
      <button class="iconbtn sidenav__close" id="btnCloseSide" aria-label="关闭目录">✕</button>
    </div>
    <div class="sidenav__bar"><i id="sideBar"></i></div>
    <nav class="sidenav__body" id="sideNav"></nav>
    <div class="sidenav__foot">
      <a href="#/map" class="sidenav__maplink">
        <span data-i18n="nav.map">知识地图</span>
        <span aria-hidden="true">↗</span>
      </a>
      <button class="sidenav__reset" id="btnResetProgress" data-i18n="common.resetProgress">重置进度</button>
      <div class="sidenav__mobile">
        <button class="btn btn--sm" id="mTheme" type="button">主题 · 纸面</button>
        <button class="btn btn--sm" id="mLang" type="button">语言 · 中文</button>
      </div>
    </div>
  </aside>
  <div class="scrim" id="scrim" hidden></div>

  <!-- 主视图 -->
  <main class="view" id="view" tabindex="-1"></main>
</div>

<footer class="footer" id="footer">
  <div class="footer__inner">
    <div class="footer__brand"><span class="brand__glyph brand__glyph--sm" aria-hidden="true">视</span> 可视化导论 · 重构版</div>
    <div class="footer__meta">
      <span>5 <span data-i18n="common.chapters">章</span> · 27 <span data-i18n="common.sections">节</span> · 20 <span data-i18n="common.interactive">个交互图</span></span>
      <span>纯静态 · 离线可用 · 无跟踪</span>
    </div>
    <div class="footer__links">
      <a href="#/about" data-i18n="nav.about">重构说明</a>
      <a href="https://cinger007.github.io/vis/" target="_blank" rel="noopener">原课程站点 ↗</a>
    </div>
  </div>
</footer>

<!-- 搜索面板 -->
<div class="palette" id="palette" hidden>
  <div class="palette__scrim" data-close-palette></div>
  <div class="palette__panel" role="dialog" aria-modal="true" aria-label="搜索">
    <div class="palette__head">
      <span class="palette__icon" aria-hidden="true">⌕</span>
      <input class="palette__input" id="paletteInput" type="search" autocomplete="off" spellcheck="false" placeholder="搜索章节、概念、代码…" aria-label="搜索">
      <button class="iconbtn" data-close-palette aria-label="关闭">✕</button>
    </div>
    <div class="palette__hint" id="paletteHint"></div>
    <div class="palette__results" id="paletteResults" role="listbox"></div>
    <div class="palette__foot">
      <span><kbd>↑</kbd><kbd>↓</kbd> 选择</span>
      <span><kbd>↵</kbd> 打开</span>
      <span><kbd>esc</kbd> 关闭</span>
    </div>
  </div>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="viz-tip" id="vizTip" role="tooltip" aria-hidden="true"></div>
